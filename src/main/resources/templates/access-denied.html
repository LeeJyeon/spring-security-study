<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>접근 거부</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h1>403 - 접근 거부</h1>
    <div class="alert alert-error">
        이 페이지에 접근할 권한이 없습니다.
    </div>
    <div class="info-box">
        <h3>왜 이 페이지가 보이나요?</h3>
        <p>
            현재 로그인한 계정의 역할(Role)이 이 페이지에 필요한 권한을 가지고 있지 않습니다.
            <code>/admin</code> 페이지는 <strong>ADMIN</strong> 역할이 필요합니다.
        </p>
    </div>
    <a href="/" class="btn">홈으로</a>
</div>
</body>
</html>
