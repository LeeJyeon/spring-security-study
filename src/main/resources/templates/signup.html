<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h1>회원가입</h1>

    <!-- 에러 메시지 -->
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <form th:action="@{/signup}" th:object="${signupRequest}" method="post" class="form">
        <div class="form-group">
            <label for="username">사용자 이름</label>
            <input type="text" id="username" th:field="*{username}"
                   placeholder="3~20자" required>
            <span class="error" th:if="${#fields.hasErrors('username')}"
                  th:errors="*{username}"></span>
        </div>

        <div class="form-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" th:field="*{password}"
                   placeholder="4자 이상" required>
            <span class="error" th:if="${#fields.hasErrors('password')}"
                  th:errors="*{password}"></span>
        </div>

        <div class="form-group">
            <label for="confirmPassword">비밀번호 재입력</label>
            <input type="password" id="confirmPassword" th:field="*{confirmPassword}"
                   placeholder="4자 이상" required>
            <span class="error" th:if="${#fields.hasErrors('confirmPassword')}"
                  th:errors="*{confirmPassword}"></span>
        </div>

        <div class="form-group">
            <label for="email">이메일</label>
            <input type="email" id="email" th:field="*{email}"
                   placeholder="example@email.com" required>
            <span class="error" th:if="${#fields.hasErrors('email')}"
                  th:errors="*{email}"></span>
        </div>

        <button type="submit" class="btn">가입하기</button>
    </form>

    <p class="text-center">
        이미 계정이 있으신가요? <a href="/login">로그인</a>
    </p>
</div>
</body>
</html>
