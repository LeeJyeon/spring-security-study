spring:
  application:
    name: spring-security-handson

  # H2 인메모리 데이터베이스 설정
  datasource:
    url: jdbc:h2:mem:securitydb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # H2 콘솔 활성화 (http://localhost:8080/h2-console)
  h2:
    console:
      enabled: true
      path: /h2-console

  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Thymeleaf 설정 (개발 편의)
  thymeleaf:
    cache: false

server:
  port: 8080
